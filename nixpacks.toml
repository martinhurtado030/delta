[phases.setup]
nixPkgs = ["nodejs_20", "python311", "python311Packages.pip"]

[phases.install]
cmds = [
  "npm install",
  "cd client && npm install --include=dev && cd ..",
  "pip install yfinance pandas requests"
]

[phases.build]
cmds = ["cd client && npx vite build"]

[start]
cmd = "node server.js"
